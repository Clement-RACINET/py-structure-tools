[project]
name = "py-structure-tools"
version = "0.1.0"
description = "Print and export repository structures without runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Clement RACINET" },
]
license = "MIT"
keywords = [
    "repository",
    "tree",
    "structure",
    "export",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = []

[project.scripts]
pystructure = "py_structure_tools.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D103",
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".pixi",
    ".venv",
    "dist",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=py_structure_tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
]
