[project]
name = "py-structure-tools"
version = "2026.10.21"
description = "Generate, print and export your project's directory tree (TXT, JSON, YAML, XML, HTML) with sizes, dates and summary, with zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Clement RACINET" },
]
license = "X11"
keywords = [
    "repository",
    "tree",
    "directory-tree",
    "project-structure",
    "structure",
    "export",
    "gitignore",
    "json",
    "yaml",
    "xml",
    "html",
    "llm",
    "cli",
    "file-size",
    "summary",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

dependencies = []

[project.urls]
Homepage = "https://gitlab.com/dev-tools-cr/python/py-structure-tools"
Repository = "https://gitlab.com/dev-tools-cr/python/py-structure-tools"

[project.scripts]
pystructure = "py_structure_tools.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_structure_tools"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D103",
    "PLR0913",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".pixi",
    ".venv",
    "dist",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=py_structure_tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
]

[tool.coverage.run]
source = ["py_structure_tools"]
omit = [
    ".pixi/*",
    "*/.pixi/*",
]

[tool.coverage.report]
omit = [
    ".pixi/*",
    "*/.pixi/*",
]
